# The faces tried, in order, for a character the interface face has no
# glyph for: the first one that has it draws it, and a character nothing
# has is a box. Read once by each program (base/ufontfallback.h); a program
# started after an edit sees it.
#
#   NAME          NAME.ttf, .otf or .ttc in /usr/share/fonts/fallback, else
#                 in /usr/share/fonts
#   NAME:N        member N of a collection (.ttc). Noto Sans CJK's: 0 Japanese,
#                 1 Korean, 2 Simplified Chinese, 3 Traditional Chinese, 4 Hong
#                 Kong -- the shapes its Han characters take
#   emoji NAME    the face an emoji (Unicode's Emoji_Presentation, or a
#                 character followed by U+FE0F) goes to FIRST
noto-sans
noto-sans-symbols2
noto-sans-symbols
noto-sans-math
noto-sans-cjk-regular:2
emoji twemoji
dejavu-sans-mono
