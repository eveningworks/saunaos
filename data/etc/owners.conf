# Who owns what on the system volume (users stage C, docs/users-design.md).
# Read by `owners` at every boot (data/etc/services.d/owners) and by the
# image seeder (tools/build/tfs3_writer.py), so a fresh disk and an old
# one end up the same.
#
#   PATH  OWNER  GROUP  MODE  SCOPE  [once]
#
# SCOPE: `self` the path alone, `below` everything under it, `tree` both.
# MODE: octal; `-` to keep each file's own; `+BITS` to add BITS to the
# folders only. The MOST SPECIFIC rule for a path wins, whatever the
# order: /etc/passwd's line beats /etc's `below`. `once` walks a big tree
# only when this file changes (or `owners --all`), not at every boot.
# Anything no rule covers is root's, as every file from before stage C is.
#
# /etc, /var AND /var/lib ARE ROOT'S, 0755 (users D3b2a): what the desktop
# changed there goes through privd (base/upriv.h) or moved to the person's
# own folders. Their `below` rules give back to root, at the next boot, a
# file the desktop's account wrote there before. They keep its MODE: an
# image synced from before keeps a 0644 /etc/mounts.d (share hashes, no
# longer read) and remote.conf's old `password =` line until they are
# removed by hand.
# /home is root's, Linux's shape; each account's home under it is theirs
# (users stage D1), and its setuid bit makes what root puts there the
# person's (FreeBSD's SUIDDIR). A home is PRIVATE, 04700, as privd makes
# one for a NEW account (users D3a), which no rule here names -- `once`,
# so a person's own chmod of it is not undone at the next boot.

/home                   root  root  0755  self
/home/user              user  user  4700  self   once
/home/user              user  user  +4000 below  once
/etc                    root  root  0755  self
/etc                    root  root  -     below
/etc/passwd             root  root  0644  self
/etc/group              root  root  0644  self
/etc/shadow             root  root  0600  self
/etc/login.conf         root  root  0644  self
/etc/shells             root  root  0644  self
/etc/environment        root  root  0644  self
/etc/profile            root  root  0644  self
/etc/owners.conf        root  root  0644  self
/etc/hwdata.conf        root  root  -     self
/etc/mime.types         root  root  -     self
/etc/timezones          root  root  -     tree
/etc/locales            root  root  -     tree
/etc/services.d         root  root  -     tree
/etc/settings.d         root  root  -     tree
/etc/modules            root  root  -     tree
/etc/realtime.d         root  root  -     tree
/etc/ssl                root  root  -     tree
/etc/skel               root  root  -     tree
/etc/fonts              root  root  -     tree
/etc/remote.key         root  root  0600  self
/etc/remote.secret      root  root  0600  self
/etc/remote.crt         root  root  -     self
/var                    root  root  0755  self
/var/lib                root  root  0755  self
/var/lib                root  root  -     below
/var/lib/update         root  root  -     tree
/var/lib/owners         root  root  -     self
/var/lib/greeter        greeter greeter 0700 tree
/var/lib/netheal        root  root  -     self
/var/lib/logd.seq       root  root  -     self
/var/log                root  root  -     tree
/var/cache              user  user  -     tree
/var/crash              user  user  -     tree
/var/tmp                root  root  1777  self
