<!DOCTYPE html>
<html><head><title>Fonts</title>
<style>
body { margin: 0; background: #ffffff; color: #000000; }
div { height: 48px; margin: 0; padding: 0 0 0 8px; font-size: 32px; line-height: 48px; white-space: nowrap; }
.sans { font-family: sans-serif; } .serif { font-family: serif; } .mono { font-family: monospace; }
.times { font-family: "Times New Roman"; }
.i { font-style: italic; } .b { font-weight: bold; }
</style></head>
<body>
<div class="sans">Hamburgefonstiv</div>
<div class="sans">Hamburgefonstiv</div>
<div class="serif">Hamburgefonstiv</div>
<div class="sans i">Hamburgefonstiv</div>
<div class="serif i">Hamburgefonstiv</div>
<div class="mono">Hamburgefonstiv</div>
<div class="mono i">Hamburgefonstiv</div>
<div class="times">Hamburgefonstiv</div>
<div class="serif b">Hamburgefonstiv</div>
<div class="serif b i">Hamburgefonstiv</div>
</body></html>
