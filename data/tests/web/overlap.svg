<?xml version="1.0" encoding="UTF-8"?>
<!-- Two squares wound the SAME way in one path: nonzero fills where they
     overlap, even-odd would cut it out. Under them, a thick curved stroke. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <path fill="#1e3cdc" d="M 5 5 L 55 5 L 55 55 L 5 55 Z M 30 30 L 80 30 L 80 80 L 30 80 Z"/>
  <path fill="none" stroke="#14a03c" stroke-width="8" d="M 5 92 C 30 70 70 70 95 92"/>
</svg>
