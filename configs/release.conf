# Release media: no serial debug console, everything else as build.conf says.
#
# A PROFILE, read on top of build.conf by `make ... PROFILE=release`
# (tools/build/build_conf.py --profile); build.local.conf is NOT read
# with it, so a profile build is committed files alone. Same syntax as
# build.conf. Release media are made with it:
#
#     make clean-disk && make live-iso usb-image PROFILE=release
#
# update_server.py --publish's profile check passes this profile and
# build.conf alone. Preflight tests the build WITH the debug console, so
# a release-profile staging is also one it never ran: publishing it needs
# --force, which says so.

option debugcon = no
