# Every sanitizer and check on: undefined behaviour, kernel addresses, per-core reads,
# lock order.
#
# A PROFILE (see release.conf beside it): `make iso PROFILE=debug`, or
# load it in `make menuconfig`. For a session hunting a memory or a
# preemption or a lock-order bug; tools/tests/sweep/sanitize_run.py reads
# what the sanitizers find, `lockstat order` what lockdep does.
# Each of the four rebuilds the whole tree, and a build made with this
# profile is never published.

option ubsan = yes
option kasan = yes
option debug_preempt = yes
option lockdep = yes
